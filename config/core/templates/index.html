<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMORA AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080b12;--surface:#0f1320;--surface2:#161d30;
  --border:rgba(96,200,255,0.12);
  --accent:#40e0ff;--accent2:#ff6b9d;--accent3:#ffd166;
  --text:#dde8f5;--text-muted:#5a7090;
  --idle:#40e0ff;--active:#60a5fa;--recording:#f87171;--speaking:#ffd166;--error:#fb923c;
  --radius:18px;
}
[data-theme="light"]{
  --bg:#eef2f8;--surface:#fff;--surface2:#e4eaf4;
  --border:rgba(0,100,200,0.1);--text:#0f1828;--text-muted:#607080;
}
html{scroll-behavior:smooth}
body{
  font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:16px 14px 40px;transition:background .4s,color .4s;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 55% 45% at 15% 15%,rgba(64,224,255,.06) 0%,transparent 65%),
    radial-gradient(ellipse 45% 55% at 85% 85%,rgba(64,128,255,.05) 0%,transparent 65%);
}
.wrapper{position:relative;z-index:1;width:100%;max-width:980px;display:flex;flex-direction:column;align-items:center;gap:14px}

/* ── HEADER ── */
header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 2px;animation:fadeDown .5s ease both}
.logo-group{display:flex;align-items:center;gap:12px}
.logo-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#00ffe0,#4080ff);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 0 20px rgba(0,255,224,.35);flex-shrink:0}
.logo-text{display:flex;flex-direction:column;gap:1px}
.logo-title{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(110deg,#40e0ff 0%,#a0f0ff 50%,#4080ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
.logo-sub{font-size:9px;color:var(--text-muted);letter-spacing:3px;text-transform:uppercase}
.header-right{display:flex;align-items:center;gap:8px}
.theme-toggle{background:var(--surface);border:1px solid var(--border);border-radius:50px;padding:5px 12px;cursor:pointer;font-size:11px;color:var(--text-muted);font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:5px;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent);color:var(--accent)}
.lang-toggle{background:var(--surface);border:1px solid var(--border);border-radius:50px;padding:3px;display:flex;align-items:center;gap:2px}
.lang-btn{padding:4px 12px;border-radius:50px;font-size:11px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text-muted);transition:all .2s;letter-spacing:.5px}
.lang-btn.active{background:linear-gradient(110deg,#40e0ff,#4080ff);color:#080b12;box-shadow:0 0 10px rgba(64,224,255,.4)}

/* ── STATUS BAR ── */
.status-bar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:50px;padding:6px 18px;font-size:12px;font-weight:500;animation:fadeDown .6s ease both;width:100%;max-width:520px}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--idle);box-shadow:0 0 8px var(--idle);flex-shrink:0;transition:all .4s}
.status-dot.active{background:var(--active);box-shadow:0 0 8px var(--active);animation:blink .8s infinite}
.status-dot.recording{background:var(--recording);box-shadow:0 0 8px var(--recording);animation:blink .6s infinite}
.status-dot.speaking{background:var(--speaking);box-shadow:0 0 8px var(--speaking);animation:blink 1s infinite}
.status-dot.error{background:var(--error);box-shadow:0 0 8px var(--error)}
#status-label{color:var(--text-muted);transition:color .4s;flex:1}
#status-label.idle{color:var(--accent)}
#status-label.active{color:var(--active)}
#status-label.recording{color:var(--recording)}
#status-label.speaking{color:var(--speaking)}
#status-label.error{color:var(--error)}

/* ── CONTROLS (moved to top) ── */
.controls{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:10px;animation:fadeDown .7s ease both}
.controls-row{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;align-items:center}
.controls-divider{width:1px;height:32px;background:var(--border);flex-shrink:0}
@media(max-width:560px){.controls-divider{display:none}}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text);transition:all .2s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.btn:active{transform:translateY(0) scale(.97)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn-icon{font-size:13px}
.btn-camera{border-color:rgba(64,224,255,.3);color:var(--accent)}
.btn-camera:hover{border-color:var(--accent);background:rgba(64,224,255,.08)}
.btn-detect-start{border-color:rgba(96,165,250,.3);color:var(--active)}
.btn-detect-start:hover{border-color:var(--active);background:rgba(96,165,250,.08)}
.btn-detect-start.is-on{border-color:var(--active);background:rgba(96,165,250,.12);animation:pulseBlue 2s ease infinite}
.btn-detect-stop{border-color:rgba(248,113,113,.3);color:var(--recording)}
.btn-detect-stop:hover{border-color:var(--recording);background:rgba(248,113,113,.08)}
.btn-rec-start{border-color:rgba(248,113,113,.3);color:var(--recording)}
.btn-rec-start:hover{border-color:var(--recording);background:rgba(248,113,113,.08)}
.btn-rec-start.is-recording{border-color:var(--recording);background:rgba(248,113,113,.12);animation:pulseRed 1.4s ease infinite}
.btn-rec-stop{border-color:rgba(248,113,113,.2);color:var(--text-muted)}
.btn-rec-stop:hover{border-color:var(--recording);color:var(--recording);background:rgba(248,113,113,.06)}
.btn-audio-stop{border-color:rgba(255,209,102,.3);color:var(--speaking)}
.btn-audio-stop:hover{border-color:var(--speaking);background:rgba(255,209,102,.08)}
.btn-audio-stop.is-playing{border-color:var(--speaking);background:rgba(255,209,102,.12);animation:pulseGold 1.8s ease infinite}

/* ── MAIN GRID ── */
.main-grid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:16px;animation:fadeUp .7s ease both}
@media(max-width:680px){.main-grid{grid-template-columns:1fr}}

/* ── CHARACTER PANEL ── */
.char-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:400px;box-shadow:0 0 36px rgba(64,224,255,.07),0 4px 28px rgba(0,0,0,.4);transition:box-shadow .4s}
.char-panel.speaking-glow{box-shadow:0 0 0 1.5px var(--speaking),0 0 50px rgba(255,209,102,.2),0 4px 28px rgba(0,0,0,.4)}
.char-bg{position:absolute;inset:0;background:radial-gradient(ellipse 90% 50% at 50% 100%,rgba(64,224,255,.07) 0%,transparent 70%)}
.scan-line{position:absolute;left:0;right:0;height:1.5px;background:linear-gradient(90deg,transparent,rgba(64,224,255,.45),transparent);animation:scanMove 5s ease-in-out infinite;top:0;z-index:3}
@keyframes scanMove{0%,100%{top:0%;opacity:0}8%{opacity:1}92%{opacity:.4}99%{top:100%;opacity:0}}
.char-name-tag{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(8,11,18,.75);backdrop-filter:blur(10px);border:1px solid rgba(64,224,255,.25);border-radius:50px;padding:3px 14px;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);font-weight:700;white-space:nowrap;text-shadow:0 0 10px var(--accent);z-index:4}
.char-emotion-badge{position:absolute;top:10px;right:10px;background:rgba(8,11,18,.8);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:10px;padding:4px 9px;font-size:11px;display:flex;align-items:center;gap:5px;opacity:0;transform:scale(.85);transition:opacity .3s,transform .3s;z-index:4}
.char-emotion-badge.visible{opacity:1;transform:scale(1)}
.char-svg-wrap{position:relative;z-index:2;width:230px;margin-bottom:4px;filter:drop-shadow(0 10px 36px rgba(0,0,0,.65))}
#emora-svg{width:100%;height:auto;overflow:visible}
.emotion-ring{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:180px;height:7px;border-radius:50%;background:rgba(64,224,255,.2);box-shadow:0 0 12px rgba(64,224,255,.3);transition:background .5s,box-shadow .5s;pointer-events:none;z-index:1}
.emotion-ring.happy,.emotion-ring.excited{background:rgba(126,255,100,.3);box-shadow:0 0 20px rgba(126,255,100,.55)}
.emotion-ring.sad{background:rgba(96,165,250,.3);box-shadow:0 0 20px rgba(96,165,250,.55)}
.emotion-ring.angry{background:rgba(248,113,113,.3);box-shadow:0 0 20px rgba(248,113,113,.55)}
.emotion-ring.surprised{background:rgba(255,209,102,.3);box-shadow:0 0 20px rgba(255,209,102,.55)}
.emotion-ring.fearful,.emotion-ring.anxious{background:rgba(167,139,250,.3);box-shadow:0 0 20px rgba(167,139,250,.55)}

/* ── VIDEO PANEL ── */
.video-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;position:relative;min-height:400px;display:flex;flex-direction:column;box-shadow:0 4px 28px rgba(0,0,0,.4);transition:box-shadow .4s}
.video-panel.recording-glow{box-shadow:0 0 0 1.5px var(--recording),0 0 45px rgba(248,113,113,.2)}
.video-inner{position:relative;flex:1;background:#050710;min-height:350px}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#canvas{display:none}
.cam-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-muted);font-size:13px}
.cam-placeholder .cam-icon{font-size:40px;opacity:.25}
.video-label{position:absolute;top:10px;left:10px;background:rgba(8,11,18,.7);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:50px;padding:3px 11px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);font-weight:600}
.recording-indicator{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:5px;background:rgba(8,11,18,.75);backdrop-filter:blur(8px);border:1px solid rgba(248,113,113,.4);border-radius:50px;padding:3px 9px;opacity:0;transition:opacity .3s}
.recording-indicator.visible{opacity:1}
.rec-dot{width:7px;height:7px;border-radius:50%;background:var(--recording);animation:blink .7s infinite}
.rec-label{font-size:10px;color:var(--recording);font-weight:700;letter-spacing:1.5px}
.thinking-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,11,18,.65);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s}
.thinking-overlay.visible{opacity:1}
.thinking-dots{display:flex;gap:8px}
.thinking-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:bounce 1.4s ease-in-out infinite}
.thinking-dot:nth-child(2){animation-delay:.2s;background:var(--active)}
.thinking-dot:nth-child(3){animation-delay:.4s;background:var(--accent2)}

/* ── BOTTOM ROW ── */
.bottom-row{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:14px;animation:fadeUp .9s ease both}
@media(max-width:680px){.bottom-row{grid-template-columns:1fr}}

/* ── TRANSCRIPT ── */
.transcript-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;display:none;max-height:160px;overflow-y:auto}
.transcript-box.visible{display:block}
.section-label{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px}
.transcript-row{display:flex;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.transcript-you{color:var(--accent);font-size:11px;font-weight:600;min-width:36px}
.transcript-emora{color:var(--speaking);font-size:11px;font-weight:600;min-width:36px}
.transcript-text{font-size:12px;color:var(--text);line-height:1.5;flex:1}

/* ── EMOTION HISTORY ── */
.emotion-history{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px}
.history-track{display:flex;gap:6px;align-items:center;min-height:32px;flex-wrap:wrap}
.history-chip{background:var(--surface2);border:1px solid var(--border);border-radius:50px;padding:2px 10px;font-size:11px;display:flex;align-items:center;gap:4px;animation:chipIn .3s ease both}
.history-empty{color:var(--text-muted);font-size:11px;font-style:italic}

/* ── QUEUE INDICATOR ── */
.queue-indicator{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);background:rgba(8,11,18,.85);border:1px solid rgba(255,209,102,.4);border-radius:50px;padding:3px 12px;font-size:10px;color:var(--speaking);display:none;white-space:nowrap;z-index:5}
.queue-indicator.visible{display:block}

/* ── ANIMATIONS ── */
@keyframes pulseBlue{0%,100%{box-shadow:0 0 0 0 rgba(96,165,250,.4)}50%{box-shadow:0 0 0 5px rgba(96,165,250,0)}}
@keyframes pulseRed{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.4)}50%{box-shadow:0 0 0 5px rgba(248,113,113,0)}}
@keyframes pulseGold{0%,100%{box-shadow:0 0 0 0 rgba(255,209,102,.4)}50%{box-shadow:0 0 0 5px rgba(255,209,102,0)}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes chipIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes headIdle{0%,100%{transform:rotate(0deg) translateY(0)}28%{transform:rotate(-1.2deg) translateY(-1px)}72%{transform:rotate(1.2deg) translateY(1px)}}
@keyframes headTilt{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-7deg)}}
@keyframes headNod{0%,100%{transform:translateY(0) rotate(0deg)}32%{transform:translateY(3px) rotate(2deg)}65%{transform:translateY(-1px) rotate(-.8deg)}}
@keyframes jacketGlow{0%,100%{opacity:.4;filter:brightness(1)}50%{opacity:1;filter:brightness(1.7)}}
@keyframes eyeGlow{0%,100%{opacity:.25}50%{opacity:.8}}
@media(max-width:600px){.logo-title{font-size:20px}.logo-icon{width:38px;height:38px;font-size:18px}.btn{padding:7px 10px;font-size:11px}.char-svg-wrap{width:190px}}
</style>
</head>
<body>
<div class="wrapper">

<!-- HEADER -->
<header>
  <div class="logo-group">
    <div class="logo-icon">🤖</div>
    <div class="logo-text">
      <div class="logo-title">EMORA AI</div>
      <div class="logo-sub">Emotion-Aware Assistant</div>
    </div>
  </div>
  <div class="header-right">
    <div class="lang-toggle">
      <button class="lang-btn" id="lang-tel" onclick="setLanguage('telugu')">తె</button>
      <button class="lang-btn active" id="lang-eng" onclick="setLanguage('english')">EN</button>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()">
      <span id="theme-icon">☀️</span><span id="theme-label">Light</span>
    </button>
  </div>
</header>

<!-- STATUS -->
<div class="status-bar">
  <div class="status-dot" id="status-dot"></div>
  <span id="status-label" class="idle">Idle — Ready</span>
</div>

<!-- CONTROLS (at top) -->
<div class="controls">
  <div class="controls-row">
    <button class="btn btn-camera" id="btn-camera" onclick="startCamera()">
      <span class="btn-icon">📷</span> Start Camera
    </button>
    <div class="controls-divider"></div>
    <button class="btn btn-detect-start" id="btn-detect-start" onclick="startDetection()">
      <span class="btn-icon">🎭</span> Start Detection
    </button>
    <button class="btn btn-detect-stop" id="btn-detect-stop" onclick="stopDetection()">
      <span class="btn-icon">⏹</span> Stop Detection
    </button>
    <div class="controls-divider"></div>
    <button class="btn btn-rec-start" id="btn-rec-start" onclick="startRecording()">
      <span class="btn-icon">🎤</span> <span id="rec-start-label">Start Speaking</span>
    </button>
    <button class="btn btn-rec-stop" id="btn-rec-stop" onclick="stopRecording()">
      <span class="btn-icon">⏹</span> <span id="rec-stop-label">Stop Speaking</span>
    </button>
    <div class="controls-divider"></div>
    <button class="btn btn-audio-stop" id="btn-audio-stop" onclick="stopAudio()">
      <span class="btn-icon">🔇</span> Stop Audio
    </button>
  </div>
</div>

<!-- MAIN GRID -->
<div class="main-grid">

  <!-- CHARACTER PANEL -->
  <div class="char-panel" id="char-panel">
    <div class="char-bg"></div>
    <div class="scan-line"></div>
    <div class="char-name-tag">EMORA · v2.4</div>
    <div class="char-emotion-badge" id="char-emotion-badge">
      <span id="char-badge-emoji">😐</span>
      <span id="char-badge-label">Neutral</span>
    </div>
    <div class="char-svg-wrap">
<!-- Full SVG character (identical to original) -->
<svg id="emora-svg" viewBox="0 0 220 400" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="gSkin" cx="50%" cy="38%" r="58%">
    <stop offset="0%" stop-color="#fad5aa"/><stop offset="65%" stop-color="#e8b480"/><stop offset="100%" stop-color="#d09060"/>
  </radialGradient>
  <linearGradient id="gHair" x1="0%" y1="0%" x2="80%" y2="100%">
    <stop offset="0%" stop-color="#1c1008"/><stop offset="100%" stop-color="#2e1a0a"/>
  </linearGradient>
  <linearGradient id="gHairHL" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="rgba(50,180,255,0)"/><stop offset="45%" stop-color="rgba(50,180,255,0.6)"/><stop offset="100%" stop-color="rgba(50,180,255,0)"/>
  </linearGradient>
  <linearGradient id="gJacket" x1="15%" y1="0%" x2="85%" y2="100%">
    <stop offset="0%" stop-color="#1a2848"/><stop offset="55%" stop-color="#0e1830"/><stop offset="100%" stop-color="#080d1e"/>
  </linearGradient>
  <linearGradient id="gJacketHL" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#20305a"/><stop offset="100%" stop-color="#121e3a"/>
  </linearGradient>
  <linearGradient id="gShirt" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#1c3858"/><stop offset="100%" stop-color="#0e1e30"/>
  </linearGradient>
  <linearGradient id="gNeonH" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="rgba(64,224,255,0)"/><stop offset="50%" stop-color="rgba(64,224,255,1)"/><stop offset="100%" stop-color="rgba(64,224,255,0)"/>
  </linearGradient>
  <linearGradient id="gNeonV" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="rgba(64,224,255,0)"/><stop offset="45%" stop-color="rgba(64,224,255,.85)"/><stop offset="100%" stop-color="rgba(64,224,255,0)"/>
  </linearGradient>
  <radialGradient id="gIris" cx="38%" cy="32%" r="65%">
    <stop offset="0%" stop-color="#70d8ff"/><stop offset="45%" stop-color="#2070b8"/><stop offset="100%" stop-color="#082848"/>
  </radialGradient>
  <radialGradient id="gEyeGlowFill" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="rgba(64,224,255,0.65)"/><stop offset="100%" stop-color="rgba(64,224,255,0)"/>
  </radialGradient>
  <radialGradient id="gHoloBadge" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="rgba(64,224,255,0.45)"/><stop offset="100%" stop-color="rgba(64,224,255,0.04)"/>
  </radialGradient>
  <filter id="fGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="fFaceShadow">
    <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="rgba(0,0,0,0.55)"/>
  </filter>
  <clipPath id="clipEyeL">
    <path d="M67,106 Q74,95 84,95 Q94,95 101,106 Q94,117 84,117 Q74,117 67,106Z"/>
  </clipPath>
  <clipPath id="clipEyeR">
    <path d="M119,106 Q126,95 136,95 Q146,95 153,106 Q146,117 136,117 Q126,117 119,106Z"/>
  </clipPath>

<script>
/* ═══════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════ */
let isDetecting    = false;
let isRecording    = false;
let isSpeaking     = false;
let isDark         = true;
let currentEmotion = 'neutral';
let emotionHistory = [];
let currentLang    = 'english';
let audioUnlocked  = false;

// Emotion queue: holds {emotion, response, audio} objects
// When AI is speaking, new detections are dropped (not queued)
// to prevent pile-up. Only the LATEST queued item plays next.
let pendingEmotion = null;  // At most one pending item

let captureInterval  = null;
let lipSyncInterval  = null;
let blinkTimeout     = null;
let isBlinking       = false;

let mediaRecorder  = null;
let audioChunks    = [];
let micStream      = null;

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition         = null;
let englishTranscript   = '';

window._currentPlayer    = null;
window._pendingAudioPath = null;

const EMOTION_EMOJIS = {
  happy:'😄', sad:'😢', angry:'😠', surprised:'😲',
  fearful:'😨', disgusted:'🤢', neutral:'😐', confused:'😕',
  calm:'😌', excited:'🤩', tired:'😴', anxious:'😰', thinking:'🤔'
};

/* ═══════════════════════════════════════════════
   DOM REFS
═══════════════════════════════════════════════ */
const video             = document.getElementById('video');
const canvas            = document.getElementById('canvas');
const statusDot         = document.getElementById('status-dot');
const statusLabel       = document.getElementById('status-label');
const videoPanel        = document.getElementById('video-panel');
const charPanel         = document.getElementById('char-panel');
const camPlaceholder    = document.getElementById('cam-placeholder');
const recIndicator      = document.getElementById('recording-indicator');
const thinkingOverlay   = document.getElementById('thinking-overlay');
const historyTrack      = document.getElementById('history-track');
const charBadge         = document.getElementById('char-emotion-badge');
const charBadgeEmoji    = document.getElementById('char-badge-emoji');
const charBadgeLabel    = document.getElementById('char-badge-label');
const emotionRing       = document.getElementById('emotion-ring');
const transcriptBox     = document.getElementById('transcript-box');
const transcriptContent = document.getElementById('transcript-content');
const queueIndicator    = document.getElementById('queue-indicator');
const queueCount        = document.getElementById('queue-count');
const headGroup         = document.getElementById('head-group');
const browLeft          = document.getElementById('brow-left');
const browRight         = document.getElementById('brow-right');
const eyelidLT          = document.getElementById('eyelid-lt');
const eyelidLB          = document.getElementById('eyelid-lb');
const eyelidRT          = document.getElementById('eyelid-rt');
const eyelidRB          = document.getElementById('eyelid-rb');
const upperLip          = document.getElementById('upper-lip');
const lowerLip          = document.getElementById('lower-lip');
const mouthInt          = document.getElementById('mouth-interior');
const teeth             = document.getElementById('teeth');
const tongue            = document.getElementById('tongue');
const smileL            = document.getElementById('smile-l');
const smileR            = document.getElementById('smile-r');
const blushL            = document.getElementById('blush-l');
const blushR            = document.getElementById('blush-r');
const sweatDrop         = document.getElementById('sweat-drop');
const tearL             = document.getElementById('tear-l');
const glowRing          = document.getElementById('glow-ring');
const thinkHL           = document.getElementById('think-halo-l');
const thinkHR           = document.getElementById('think-halo-r');
const eyeGlowL          = document.getElementById('eye-glow-l');
const eyeGlowR          = document.getElementById('eye-glow-r');

/* ═══════════════════════════════════════════════
   STATUS
═══════════════════════════════════════════════ */
function setStatus(msg, type = 'idle') {
  statusLabel.textContent = msg;
  statusLabel.className   = type;
  statusDot.className     = 'status-dot' + (type !== 'idle' ? ' ' + type : '');
}

/* ═══════════════════════════════════════════════
   THEME
═══════════════════════════════════════════════ */
function toggleTheme() {
  isDark = !isDark;
  document.documentElement.setAttribute('data-theme', isDark ? '' : 'light');
  document.getElementById('theme-icon').textContent  = isDark ? '☀️' : '🌙';
  document.getElementById('theme-label').textContent = isDark ? 'Light' : 'Dark';
}

/* ═══════════════════════════════════════════════
   AUDIO UNLOCK
═══════════════════════════════════════════════ */
function unlockAudio() {
  if (audioUnlocked) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination); src.start(0);
    ctx.resume().then(() => { audioUnlocked = true; });
  } catch(e) { audioUnlocked = true; }
}

/* ═══════════════════════════════════════════════
   INTERNAL PLAY — Telugu audio file
   Calls onFinished() when done or on error
═══════════════════════════════════════════════ */
function _doPlay(path, onFinished) {
  if (window._currentPlayer) {
    window._currentPlayer.pause();
    window._currentPlayer.src = '';
    window._currentPlayer = null;
  }

  const player = new Audio(path);
  window._currentPlayer = player;
  isSpeaking = true;
  setStatus('EMORA Speaking…', 'speaking');
  document.getElementById('btn-audio-stop').classList.add('is-playing');
  startLipSync();

  const done = () => {
    isSpeaking = false;
    stopLipSync();
    document.getElementById('btn-audio-stop').classList.remove('is-playing');
    window._currentPlayer = null;
    if (onFinished) onFinished();
    else _afterSpeakDone();
  };

  player.play().catch((e) => {
    console.error('Play failed:', e);
    // Store for retry on next click
    window._pendingAudioPath = path;
    window._pendingOnFinished = onFinished;
    isSpeaking = false;
    stopLipSync();
    document.getElementById('btn-audio-stop').classList.remove('is-playing');
    setStatus('Tap anywhere to hear EMORA', 'error');
  });

  player.onended = done;
  player.onerror = done;
}

function _afterSpeakDone() {
  // Check if there's a pending emotion to speak about
  if (pendingEmotion && isDetecting) {
    const next = pendingEmotion;
    pendingEmotion = null;
    updateQueueUI();
    _speakEmotionItem(next);
  } else {
    pendingEmotion = null;
    updateQueueUI();
    if (isDetecting) setStatus('Detecting emotions…', 'active');
    else setStatus('Idle — Ready', 'idle');
  }
}

function updateQueueUI() {
  if (pendingEmotion) {
    queueCount.textContent = '1';
    queueIndicator.classList.add('visible');
  } else {
    queueIndicator.classList.remove('visible');
  }
}

/* ═══════════════════════════════════════════════
   LANGUAGE TOGGLE — full reset
═══════════════════════════════════════════════ */
function setLanguage(lang) {
  // Stop everything
  stopAllMedia();

  currentLang = lang;
  document.getElementById('lang-eng').classList.toggle('active', lang === 'english');
  document.getElementById('lang-tel').classList.toggle('active', lang === 'telugu');

  pendingEmotion = null;
  updateQueueUI();

  if (lang === 'english') {
    transcriptBox.classList.add('visible');
    document.getElementById('rec-start-label').textContent = 'Start Speaking';
    document.getElementById('rec-stop-label').textContent  = 'Stop Speaking';
    setStatus('English mode — Ready', 'idle');
  } else {
    transcriptBox.classList.remove('visible');
    document.getElementById('rec-start-label').textContent = 'Start Recording';
    document.getElementById('rec-stop-label').textContent  = 'Stop Recording';
    setStatus('Telugu mode — Ready', 'idle');
  }
}

function stopAllMedia() {
  // Cancel TTS
  if (window.speechSynthesis) window.speechSynthesis.cancel();

  // Cancel audio player
  if (window._currentPlayer) {
    window._currentPlayer.pause();
    window._currentPlayer.src = '';
    window._currentPlayer = null;
  }
  window._pendingAudioPath = null;
  window._pendingOnFinished = null;

  // Stop detection
  if (isDetecting) {
    isDetecting = false;
    clearInterval(captureInterval);
    captureInterval = null;
    document.getElementById('btn-detect-start').classList.remove('is-on');
  }

  // Stop recording
  if (isRecording) {
    if (recognition) { try { recognition.stop(); } catch(e){} recognition = null; }
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      try { mediaRecorder.stop(); } catch(e){}
    }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    isRecording = false;
    document.getElementById('btn-rec-start').classList.remove('is-recording');
    recIndicator.classList.remove('visible');
    videoPanel.classList.remove('recording-glow');
  }

  isSpeaking = false;
  stopLipSync();
  document.getElementById('btn-audio-stop').classList.remove('is-playing');
  thinkingOverlay.classList.remove('visible');
  headGroup.style.animation = 'headIdle 5s ease-in-out infinite';
}

/* ═══════════════════════════════════════════════
   BUTTON 1 — CAMERA
═══════════════════════════════════════════════ */
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
    camPlaceholder.style.display = 'none';
    document.getElementById('btn-camera').disabled = true;
    setStatus('Camera active', 'active');
  } catch(e) {
    setStatus('Camera access denied', 'error');
  }
}

/* ═══════════════════════════════════════════════
   BUTTON 2/3 — DETECTION
═══════════════════════════════════════════════ */
function startDetection() {
  if (isDetecting)      { setStatus('Detection already running', 'active'); return; }
  if (isRecording)      { setStatus('Stop recording first', 'error'); return; }
  if (!video.srcObject) { setStatus('Start camera first', 'error'); return; }
  isDetecting = true;
  pendingEmotion = null;
  updateQueueUI();
  document.getElementById('btn-detect-start').classList.add('is-on');
  captureInterval = setInterval(captureFrame, 3000); // 3s to avoid flood
  setStatus('Detecting emotions…', 'active');
}

function stopDetection() {
  if (!isDetecting) { setStatus('Detection not running', 'idle'); return; }
  isDetecting = false;
  clearInterval(captureInterval);
  captureInterval = null;
  pendingEmotion = null;
  updateQueueUI();
  document.getElementById('btn-detect-start').classList.remove('is-on');
  if (!isSpeaking) setStatus('Detection stopped — Idle', 'idle');
}

/* ── Capture frame & call backend ── */
function captureFrame() {
  // Don't capture if currently speaking (prevent pile-up)
  if (!isDetecting || isSpeaking) return;

  canvas.width  = video.videoWidth  || 640;
  canvas.height = video.videoHeight || 480;
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  const image  = canvas.toDataURL('image/png');
  const params = new URLSearchParams({ image, lang: currentLang });

  fetch('/receive_image/', { method: 'POST', body: params })
    .then(r => r.json())
    .then(data => {
      if (!isDetecting) return;
      if (data.error)   return;

      const emotion  = data.emotion;
      const response = data.response || '';
      const audio    = data.audio    || '';

      // Update emotion display
      if (emotion) showEmotion(emotion);

      if (isSpeaking) {
        // AI is talking — store as pending (overwrite old pending)
        pendingEmotion = { emotion, response, audio };
        updateQueueUI();
        return;
      }

      // Speak now
      _speakEmotionItem({ emotion, response, audio });
    })
    .catch(() => {});
}

function _speakEmotionItem(item) {
  const { emotion, response, audio } = item;
  if (emotion) showEmotion(emotion);

  if (currentLang === 'english') {
    if (response) speakEnglishTTS(response, _afterSpeakDone);
  } else {
    if (audio) _doPlay(audio, _afterSpeakDone);
    else _afterSpeakDone();
  }
}

/* ═══════════════════════════════════════════════
   BUTTON 4 — START RECORDING
═══════════════════════════════════════════════ */
async function startRecording() {
  if (isRecording) { setStatus('Already recording', 'recording'); return; }
  if (isDetecting) { setStatus('Stop detection first', 'error'); return; }
  if (isSpeaking)  { setStatus('Wait for EMORA to finish', 'error'); return; }

  unlockAudio();

  if (currentLang === 'english') startEnglishListening();
  else startTeluguRecording();
}

/* ═══════════════════════════════════════════════
   BUTTON 5 — STOP RECORDING
═══════════════════════════════════════════════ */
function stopRecording() {
  if (!isRecording) { setStatus('Not recording', 'idle'); return; }
  if (currentLang === 'english') stopEnglishListening();
  else stopTeluguRecording();
}

/* ══════════════════════
   ENGLISH VOICE FLOW
══════════════════════ */
function startEnglishListening() {
  if (!SpeechRecognition) { setStatus('Speech recognition not supported', 'error'); return; }
  englishTranscript = '';
  recognition = new SpeechRecognition();
  recognition.lang = 'en-IN';
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onresult = (event) => {
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) englishTranscript += event.results[i][0].transcript + ' ';
      else interim += event.results[i][0].transcript;
    }
    if (interim) setStatus('Listening: ' + interim.slice(0, 40) + '…', 'recording');
  };

  recognition.onerror = (e) => {
    setStatus('Mic error: ' + e.error, 'error');
    isRecording = false;
    document.getElementById('btn-rec-start').classList.remove('is-recording');
    recIndicator.classList.remove('visible');
    videoPanel.classList.remove('recording-glow');
    headGroup.style.animation = 'headIdle 5s ease-in-out infinite';
  };

  recognition.start();
  isRecording = true;
  document.getElementById('btn-rec-start').classList.add('is-recording');
  recIndicator.classList.add('visible');
  videoPanel.classList.add('recording-glow');
  headGroup.style.animation = 'headNod 1.2s ease-in-out infinite';
  setStatus('Listening… Speak now', 'recording');
}

function stopEnglishListening() {
  if (recognition) { try { recognition.stop(); } catch(e){} recognition = null; }
  isRecording = false;
  document.getElementById('btn-rec-start').classList.remove('is-recording');
  recIndicator.classList.remove('visible');
  videoPanel.classList.remove('recording-glow');
  headGroup.style.animation = 'headIdle 5s ease-in-out infinite';

  const text = englishTranscript.trim();
  if (!text) { setStatus('Nothing heard — try again', 'idle'); return; }

  setStatus('Thinking…', 'active');
  thinkingOverlay.classList.add('visible');
  applyEmotion('thinking');
  addTranscriptLine('you', text);

  fetch('/english_voice_input/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text })
  })
  .then(r => r.json())
  .then(data => {
    thinkingOverlay.classList.remove('visible');
    if (data.response) {
      addTranscriptLine('emora', data.response);
      // Direct voice answer — use neutral emotion context
      speakEnglishTTS(data.response, () => {
        applyEmotion(currentEmotion);
        setStatus('Idle — Ready', 'idle');
      });
    } else {
      applyEmotion(currentEmotion);
      setStatus('Idle — Ready', 'idle');
    }
  })
  .catch(() => {
    thinkingOverlay.classList.remove('visible');
    applyEmotion(currentEmotion);
    setStatus('Network error', 'error');
  });
}

/* ── English TTS using Web Speech API ── */
function speakEnglishTTS(text, onDone) {
  if (!window.speechSynthesis) {
    setStatus('TTS not supported', 'error');
    if (onDone) onDone();
    return;
  }
  window.speechSynthesis.cancel();

  const doSpeak = () => {
    const utter  = new SpeechSynthesisUtterance(text);
    utter.lang   = 'en-IN';
    utter.rate   = 0.5;
    utter.pitch  = 1;
    utter.volume = 1;
    const voices  = window.speechSynthesis.getVoices();
    const enVoice = voices.find(v => v.lang.startsWith('en') && v.localService);
    if (enVoice) utter.voice = enVoice;

    isSpeaking = true;
    setStatus('EMORA Speaking…', 'speaking');
    document.getElementById('btn-audio-stop').classList.add('is-playing');
    startLipSync();

    const finish = () => {
      isSpeaking = false;
      stopLipSync();
      document.getElementById('btn-audio-stop').classList.remove('is-playing');
      if (onDone) onDone();
      else _afterSpeakDone();
    };

    utter.onend   = finish;
    utter.onerror = finish;
    window.speechSynthesis.speak(utter);
  };

  if (window.speechSynthesis.getVoices().length > 0) doSpeak();
  else window.speechSynthesis.onvoiceschanged = doSpeak;
}

function addTranscriptLine(who, text) {
  const row   = document.createElement('div');
  row.className = 'transcript-row';
  const label = document.createElement('span');
  label.className   = who === 'you' ? 'transcript-you' : 'transcript-emora';
  label.textContent = who === 'you' ? 'You' : 'EMORA';
  const msg = document.createElement('span');
  msg.className   = 'transcript-text';
  msg.textContent = text;
  row.appendChild(label);
  row.appendChild(msg);
  transcriptContent.appendChild(row);
  transcriptBox.scrollTop = transcriptBox.scrollHeight;
}

/* ══════════════════════
   TELUGU VOICE FLOW
══════════════════════ */
async function startTeluguRecording() {
  try {
    audioChunks = [];
    micStream   = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(micStream);
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = sendVoiceAudio;
    mediaRecorder.start();
    isRecording = true;
    document.getElementById('btn-rec-start').classList.add('is-recording');
    recIndicator.classList.add('visible');
    videoPanel.classList.add('recording-glow');
    headGroup.style.animation = 'headNod 1.2s ease-in-out infinite';
    setStatus('Recording… Speak now', 'recording');
  } catch(e) {
    setStatus('Microphone access denied', 'error');
  }
}

function stopTeluguRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
  isRecording = false;
  document.getElementById('btn-rec-start').classList.remove('is-recording');
  recIndicator.classList.remove('visible');
  videoPanel.classList.remove('recording-glow');
  headGroup.style.animation = 'headIdle 5s ease-in-out infinite';
  setStatus('Processing voice…', 'active');
  thinkingOverlay.classList.add('visible');
  applyEmotion('thinking');
}

function sendVoiceAudio() {
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  const blob = new Blob(audioChunks, { type: 'audio/wav' });
  const fd   = new FormData();
  fd.append('audio', blob, 'recording.wav');

  fetch('/voice_input/', { method: 'POST', body: fd })
    .then(r => r.json())
    .then(data => {
      thinkingOverlay.classList.remove('visible');
      if (data.emotion) showEmotion(data.emotion);
      if (data.audio) {
        _doPlay(data.audio, () => {
          applyEmotion(currentEmotion);
          setStatus('Idle — Ready', 'idle');
        });
      } else {
        applyEmotion(currentEmotion);
        setStatus('Idle — Ready', 'idle');
      }
    })
    .catch(() => {
      thinkingOverlay.classList.remove('visible');
      applyEmotion(currentEmotion);
      setStatus('Voice backend error', 'error');
    });
}

/* ═══════════════════════════════════════════════
   BUTTON 6 — STOP AUDIO
═══════════════════════════════════════════════ */
function stopAudio() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();

  if (window._currentPlayer) {
    window._currentPlayer.pause();
    window._currentPlayer.src = '';
    window._currentPlayer = null;
  }

  window._pendingAudioPath    = null;
  window._pendingOnFinished   = null;
  pendingEmotion              = null;
  isSpeaking                  = false;
  updateQueueUI();
  stopLipSync();
  document.getElementById('btn-audio-stop').classList.remove('is-playing');

  if (isDetecting) setStatus('Detecting emotions…', 'active');
  else setStatus('Audio stopped — Idle', 'idle');
}

/* ═══════════════════════════════════════════════
   EMOTION DISPLAY
═══════════════════════════════════════════════ */
function showEmotion(emotion) {
  const key = emotion.toLowerCase();
  const em  = EMOTION_EMOJIS[key] || '🤔';
  charBadgeEmoji.textContent = em;
  charBadgeLabel.textContent = emotion.charAt(0).toUpperCase() + emotion.slice(1);
  charBadge.classList.add('visible');
  applyEmotion(key);
  currentEmotion = key;
  emotionRing.className = 'emotion-ring ' + key;
  if (!isSpeaking) setStatus('Emotion: ' + emotion, 'active');
  emotionHistory.push({ emoji: em, label: key });
  if (emotionHistory.length > 10) emotionHistory.shift();
  renderHistory();
}

function renderHistory() {
  if (!emotionHistory.length) {
    historyTrack.innerHTML = '<span class="history-empty">No emotions detected yet</span>';
    return;
  }
  historyTrack.innerHTML = emotionHistory.map((e, i) =>
    `<div class="history-chip" style="animation-delay:${i*.04}s">
       <span>${e.emoji}</span><span>${e.label}</span>
     </div>`
  ).join('');
}

function startLipSync() {
  if (lipSyncInterval) return;
  charPanel.classList.add('speaking-glow');
  glowRing.setAttribute('rx','85'); glowRing.setAttribute('ry','10');
  headGroup.style.animation = 'headNod 0.88s ease-in-out infinite';
  const weights = [1,3,3,2,2], total = 11;
  lipSyncInterval = setInterval(() => {
    let r = Math.random() * total, cum = 0;
    for (let i = 0; i < weights.length; i++) {
      cum += weights[i];
      if (r < cum) { lipFrames[i](); break; }
    }
  }, 108);
}

function stopLipSync() {
  if (lipSyncInterval) { clearInterval(lipSyncInterval); lipSyncInterval = null; }
  lipFrames[0]();
  charPanel.classList.remove('speaking-glow');
  glowRing.setAttribute('rx','0'); glowRing.setAttribute('ry','0');
  headGroup.style.animation = 'headIdle 5s ease-in-out infinite';
  applyEmotion(currentEmotion);
}
